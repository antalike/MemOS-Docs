versions:
  - name: v2.0.13
    date: 2026-04-09
    changedInfo:
      Improvements:
        - type: Оптимизация Уровней Журналов Планирования
          changedInfo:
            - Снизить журналы с высокой частотой, повторяющиеся и печатаемые по строкам с info до debug, значительно снизить шум журналов и нагрузку на хранение в онлайн-режиме.
        - type: Структурирование Журналов Очереди
          changedInfo:
            - Локальные очереди и журналы очереди Redis унифицированы в структурированные поля (например, label/item_id/user_id/mem_cube_id/stream), избегая длинных журналов, что делает поиск и агрегацию более стабильными.
        - type: Наблюдаемость Ключевых Путей Цепочки Планирования
          changedInfo:
            - Дополнить сводные журналы ключевых узлов "Отправка -> Извлечение -> Распределение", чтобы быстрее локализовать накопление, аномалии распределения и заторы задач.

  - name: v2.0.12
    date: 2026-04-02
    changedInfo:
      Improvements:
        - type: Оптимизация Сервиса
          changedInfo:
            - Добавлен минимальный размер потока как настраиваемый параметр, поддерживающий динамическую настройку размера пула потоков во время выполнения, эффективно контролируя количество активных соединений и избегая резкого увеличения нагрузки на систему из-за мгновенного всплеска трафика.

  - name: v2.0.11
    date: 2026-03-26
    changedInfo:
      New Features:
        - type: LLM и Поисковые Возможности
          changedInfo:
            - Добавлен MiniMax в качестве LLM Provider, следуя тому же режиму подключения, что и Qwen, DeepSeek, через совместимый с OpenAI API.
            - Добавлен Tavily в качестве подключаемого интернет-поискового бэкенда. Tavily API может быть активирован через конфигурацию для выполнения реального сетевого поиска, предоставляя системе памяти возможность дополнения внешними знаниями.
        - type: Развертывание и Эксплуатация 
          changedInfo:
            - Добавлена конечная точка health check API для мониторинга состояния сервиса. Поддерживает контейнерную оркестрацию (например, Kubernetes liveness/readiness probe) и проверку состояния балансировщика нагрузки.
            - Добавлен производственный Dockerfile (многоступенчатая сборка) и Kubernetes Helm Chart, включающий конфигурацию оркестрации для MemOS API сервиса, Neo4j графовой базы данных, Qdrant векторной базы данных, а также Ingress и пример файла values, поддерживающий однокнопочное развертывание в K8s кластере.
        - type: Расширение Возможностей Интерфейса
          changedInfo:
            - Ранее интерфейс delete_memory поддерживал только удаление по memory_id. Это обновление расширяет условия фильтрации для удаления, поддерживая массовое удаление памяти по user_id и conversation_id, а также добавляет проверку параметров фильтрации на уровне API, одновременно реализуя метод delete_node_by_params для бэкенда PostgreSQL.
      Bug Fixes:
        - type: MCP и Обработка Сообщений
          changedInfo:
            - Исправлена проблема формата сообщения инструмента MCP add_memory;
            - Исправлена проблема, из-за которой get_further_suggestion не мог обрабатывать входные параметры типа string.
        - type: Память и Обратная Связь
          changedInfo:
            - Исправлена ошибка, из-за которой связанные узлы памяти ошибочно архивировались после выполнения пользователем операции обратной связи (feedback), что приводило к невозможности их нахождения при последующем поиске;
        - type: Neo4j 
          changedInfo:
            - Исправлена проблема логики фильтрации после поиска в Neo4j;
            - Исправлена проблема записи вложенных метаданных в Neo4j.

  - name: v2.0.10
    date: 2026-03-19
    changedInfo:
      Improvements:
        - type: База Данных PolarDB
          changedInfo:
            - Оптимизация и обновление polardb, оптимизация путей выполнения запросов с несколькими условиями фильтрации, улучшение использования CPU и памяти за счет использования новых возможностей ядра, что позволяет ускорить запросы в несколько раз и снизить нагрузку на систему.
        - type: Оптимизация Сервиса Версий Памяти
          changedInfo:
            - Плагинизация версий памяти.
            - Добавлена высокая доступность для модели NLI.
            - В memreader добавлен маршрут для версий памяти, если нет соответствующего вызова памяти/содержимого, которое по полному суждению модели nli считается не относящимся, то используется старый prompt и модель, иначе используется плагин версии памяти (qwen-flash).
        - type: Оптимизация Сервиса
          changedInfo:
            - Оптимизация и улучшение задач планирования, улучшение использования памяти.

  - name: v2.0.9
    date: 2026-03-16
    changedInfo:
      Improvements:
        - type: Совместимость Версий Памяти с Обратной Связью
          changedInfo:
            - При обновлении узлов через Feedback используется логика версий памяти, обновления происходят в оригинальном узле, а старое содержимое перемещается в поле history.
        - type: Оптимизация Версий Памяти
          changedInfo:
            - В процессе разрешения конфликтов/объединения дубликатов версия памяти была полностью оптимизирована для "восстановления независимых фактов из прошлых версий", в настоящее время она может более стабильно и точно восстанавливать независимые факты, сохраняя целостность информации о памяти и уменьшая путаницу памяти, вызванную нестабильными ответами модели.
      Bug Fixes:
        - type: Исправление ошибок параметров версий памяти и других
          changedInfo:
            - Исправлены несколько ошибок проверки параметров версий памяти, когда ключ пустой после обновления, и ошибка времени обновления.
        - type: Исправление проблем с обратной связью
          changedInfo:
            - Исправлена проблема, когда sources пусты в процессе обратной связи.
  - name: v2.0.8
    date: 2026-03-05
    changedInfo:
      New Features:
        - type: Новые Функции
          changedInfo:
            - При добавлении памяти автоматически выполняется проверка на конфликты/дубликаты, слияние и архивирование, сохраняется последнее содержимое памяти, а старое содержимое помещается в историческое поле;
      Improvements:
        - type: Миграция Предпочтений Памяти в Графовую Базу Данных
          changedInfo:
            - Миграция предпочтений памяти в графовую базу данных, унифицированная с другими типами памяти;
        - type: Оптимизация Версий Памяти
          changedInfo:
            - Функция версий памяти полностью мигрирована на асинхронное выполнение, не влияя на задержку интерфейса addMessage при async_mode=true;
        - type: Оптимизация Базы Данных
          changedInfo:
            - Использование семафоров для реализации детализированного ограничения параллелизма, в сочетании с автоматическим исключением неисправных соединений и управлением жизненным циклом потоков, повышает стабильность системы при высокой конкуренции.
            - Оптимизация уровня и содержания журналов, сохранение ключевых исполнительных траекторий, снижение влияния записи журналов на производительность базы данных.
            - С помощью триггерного предварительного прогрева горячие данные загружаются в кэш, избегая высокой задержки, вызванной холодным запуском.
      Bug Fixes:
        - type: Ошибка Быстрого Добавления Памяти
          changedInfo:
            - При добавлении памяти, если выбрана MultiModalStruct, в режиме fast в некоторых случаях не выполнялась операция embedding, что приводило к тому, что память в быстром режиме не могла быть найдена;
        - type: Ошибка Мульти Модальной Памяти
          changedInfo:
            - Для изображений памяти исправлена ошибка, не интерпретирующая содержимое изображения.
        - type: Поиск Памяти
          changedInfo:
            - Сокращение повторных вызовов get_by_metadata в поиске памяти, что снизило время поиска.
        - type: Исправление проблемы с конкурентностью версий памяти.
          changedInfo:
            - Функция версий памяти теперь обрабатывает несколько запросов add в порядке времени, даже если они поступают в короткий промежуток времени, а не откатывается к игнорированию.
  - name: v2.0.7
    date: 2026-02-27
    changedInfo:
      Improvements:
        - type: Оптимизация Параметров
          changedInfo:
            - Параметр relativity интерфейсов search и chat, используемый для фильтрации возвращенной памяти по баллу релевантности, теперь имеет значение по умолчанию 0.45.
        - type: Оптимизация Логов
          changedInfo:
            - Перехват некоторых ошибок логов, изменение уровней некоторых логов.
  - name: v2.0.6
    date: 2026-02-12
    changedInfo:
      New Features:
        - type: Оптимизация Поиска
          changedInfo:
            - На этапе search добавлен поиск по ключевым словам, а relativity по-прежнему использует косинусное сходство векторов.
            - Интерфейс Chat добавил поле вывода relativity, пользователи могут использовать relativity для контроля порога поиска в чате.
      Bug Fixes:
        - type: Исправление Проблем
          changedInfo:
            - Исправлена ошибка использования поля в фильтрации по порогу предпочтительной памяти.
            - Исправлена проблема, из-за которой вызов интерфейса get_memory с параметром filter, одновременно передающим field condition и логические операторы AND/OR/NOT, мог завершиться неудачей или зависанием.
            - Исправлены некоторые проблемы с передачей LLM extra body, совместимость с вводом параметра enable thinking для LLM.
  - name: v2.0.5
    date: 2026-02-10
    changedInfo:
      New Features:
        - type: Оптимизация Поиска в Базе Знаний
          changedInfo:
            - Двунаправленный Поиск: поддержка совместного хранения и поиска "оригинал + память", возможность настройки режима возврата.
            - Контекстное Пробуждение: поддержка возврата контекста до и после фрагментов, улучшение семантической связности длинных текстов.
            - Точная Фильтрация Релевантности: интерфейс search добавил поле relativity (0~1), поддержка фильтрации низкокачественного возврата по порогу.
        - type: MindDock
          changedInfo:
            - Облачный Сервис Skill: добавлена поддержка облачных сервисов и быстрый доступ.
            - Инъекция Prompt в Реальном Времени: динамическая инъекция модуля Skill в чате, реализация взаимодействия между несколькими моделями.
        - type: Удаление Памяти MCP
          changedInfo:
            - При распознавании намерения удаления одновременно вызываются deleteMemory и addFeedback.
      Improvements:
        - type: Реконструкция Pipeline и Поиска
          changedInfo:
            - Реконструкция Pipeline: цепочка поиска переработана в четыре этапа: Search -> Enhance -> Rerank -> Filter, управляется единым API.
            - Оптимизация Распределения: модульный обработчик задач, исправлены проблемы сериализации Redis Streams и передачи user_context.
        - type: Оптимизация Skills
          changedInfo:
            - Локализация Документации Skills: поддержка локального хранения документации по навыкам и генерация уникального URL, доступного для прямого скачивания через API.
            - Оптимизация Генерации Skills: теперь можно генерировать более богатые и полные навыки из исторической информации, добавленной пользователем.
      Bug Fixes:
        - type: Оптимизация Playground
          changedInfo:
            - Исправлены известные проблемы с опытом, повышена стабильность среды.
  - name: v2.0.4
    date: 2026-01-30
    changedInfo:
      New Features:
        - type: Основные Возможности
          changedInfo:
            - Добавлен Skill Memory.
            - Добавлена поддержка связанных модулей для функции версий памяти.
            - Добавлен интерфейс chat/completions, совместимый с OAI.
      Improvements:
        - type: Оптимизация Поиска
          changedInfo:
            - Сокращено дублирование фактической памяти и предпочтительной памяти на этапе поиска.
      Bug Fixes:
        - type: Исправление Проблем
          changedInfo:
            - Решена ошибка для новых пользователей Playground.
            - Исправлена случайная проблема зависания при добавлении памяти в облачном сервисе.
            - Решена проблема эффективности графовой базы данных.
  - name: v2.0.3
    date: 2026-01-22
    changedInfo:
      New Features:
        - type: Документация
          changedInfo:
            - Документация открытого проекта, исправлены проблемы с форматом, описанием примеров, несоответствием между китайским и английским, добавлены небольшие советы по использованию.
        - type: Dashboard
          changedInfo:
            - База знаний добавила поддержку новых типов файлов, поддержка json, md, xml.
        - type: Пример Репозитория GitHub
          changedInfo:
            - Изменен способ запуска (новый класс server router), удалена ссылка на src/memos/product_api.py.
      Improvements:
        - type: Открытый Проект
          changedInfo:
            - Оптимизация добавления текстовой и изображенческой памяти, обработка двух типов информации как одного сообщения.
            - Поиск в базе знаний поддерживает поле all.
      Bug Fixes:
        - type: Открытый Проект
          changedInfo:
            - Исправлена ошибка вызова при слишком длинном вводе текста для поиска.

  - name: v2.0.2
    date: 2026-01-15
    changedInfo:
      New Features:
        - type: Выпущено руководство по созданию "Ассистента Вопросов и Ответов Базы Знаний".
          changedInfo:
            - Обновление официальной документации «Лучшие практики разработки помощника по вопросам на основе и знаний» пошагово обучает вас создавать «MemOS Помощник по Знаниям».
      Improvements:
        - type: Вызов документов базы знаний
          changedInfo:
            - Дальнейшее улучшение способности интерфейса поиска памяти к вызову деталей содержания документов базы знаний, оптимизация качества ответов на основе содержания документов.
        - type: Механизм памяти инструментов
          changedInfo:
            - Добавление программного опыта, связанного с вызовами, для повышения вспомогательного эффекта памяти инструментов;
            - Сжатие информации схемы инструмента, чтобы избежать повторного добавления ToolSchemaMemory.
        - type: Механизм объединения и архивирования фактической памяти
          changedInfo:
            - В процессе обработки фактической памяти добавлен механизм объединения и архивирования, оптимизированы проблемы повторной записи и повторного вызова памяти, при этом обеспечивается сохранение целостности извлечения.
        - type: Интерфейс получения памяти
          changedInfo:
            - Поддержка возврата памяти инструментов;
            - Поддержка возврата памяти при определенных условиях фильтрации для отладки, демонстрации и других сценариев.
      Bug Fixes:
        - type: Интерфейс получения памяти
          changedInfo:
            - Исправлена ошибка вызова интерфейса получения памяти, когда входной параметр равен include_preference=False.

  - name: v2.0.1
    date: 2026-01-08
    changedInfo:
      New Features:
        - type: Запуск интерфейса получения памяти
          changedInfo:
            - Запуск интерфейса получения памяти, поддержка полного получения пользовательской памяти.
        - type: Запуск функции диалога в облачном сервисе
          changedInfo:
            - Запуск функции диалога в облачном сервисе, одно нажатие для начала диалога «память постоянная».
        - type: Обновление Playground
          changedInfo:
            - Страница управления памятью Playground поддерживает удаление памяти, поддерживает ручное управление пользователем для удаления устаревшей памяти.
      Improvements:
        - type: Интерфейс удаления памяти
          changedInfo:
            - Оптимизация интерфейса удаления памяти, поддержка удаления всех типов памяти, включая пользовательскую память, память базы знаний и т.д.
        - type: Предпочтительная память
          changedInfo:
            - Интерфейс feedback добавляет операции обработки обратной связи для предпочтительной памяти.
        - type: Оптимизация поиска памяти
          changedInfo:
            - Интерфейс search поддерживает необязательный параметр удаления дубликатов, поддерживает семантическое удаление дубликатов для повышения разнообразия результатов поиска.
      Bug Fixes:
        - type: Исправление проблем с kv cache
          changedInfo:
            - Решение проблемы с ошибками в коде kv cache в новой версии MemOS из-за проблем совместимости.
        - type: Исправление проблем с модулем планирования
          changedInfo:
            - Исправлена ошибка, возникающая при включении локального режима планирования из-за отсутствия конфигурации redis.

  - name: v2.0.0
    date: 2025-12-24
    changedInfo:
      New Features:
        - type: Способности базы знаний и памяти
          changedInfo:
            - Добавлена функция базы знаний, поддерживающая создание самосовершенствующейся долгосрочной системы памяти на основе документов и URL.
        - type: Обратная связь и управление памятью
          changedInfo:
            - Добавлена возможность обратной связи и исправления памяти, поддерживающая естественное языковое изменение существующей памяти.
            - Добавлен интерфейс удаления памяти, поддерживающий удаление указанной пользовательской памяти по идентификатору памяти.
            - MCP добавляет возможности удаления и обратной связи памяти.
        - type: Диалог и поиск
          changedInfo:
            - Добавлен интерфейс чата, поддерживающий ответ на основе исторической памяти.
            - Поддержка фильтрации памяти и поиска по пользовательским тегам / информации (облачный сервис и открытый проект).
        - type: Мультимодальность и память инструментов
          changedInfo:
            - Добавлена поддержка памяти инструментов, поддерживающая извлечение и поиск опыта вызовов инструментов.
            - Добавлена поддержка памяти для сообщений с изображениями, поддерживающая понимание изображений в диалогах и документах.
      Improvements:
        - type: Данные и инфраструктура
          changedInfo:
            - Обновление базового DB, повышение стабильности, управления подключениями и производительности операций с данными.
        - type: Модуль планирования
          changedInfo:
            - Реконструкция системы планирования, внедрение Redis Streams и механизма изоляции многоуровневых очередей.
