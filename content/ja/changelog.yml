versions:
  - name: v2.0.13
    date: 2026-04-09
    changedInfo:
      Improvements:
        - type: 调度日志分级优化
          changedInfo:
            - 将高频、重复、逐条打印的日志从 info 下调到 debug，明显降低线上日志噪音和存储压力。
        - type: 队列日志结构化
          changedInfo:
            - 本地队列和 Redis 队列日志统一为结构化字段（如 label/item_id/user_id/mem_cube_id/stream），避免大段内容日志，检索和聚合更稳定
        - type: 调度链路关键路径可观测
          changedInfo:
            - 补齐“提交 -> 出队 -> 分发”关键节点的摘要日志，定位堆积、分发异常、任务拥堵更快。

  - name: v2.0.12
    date: 2026-04-02
    changedInfo:
      Improvements:
        - type: 服务优化
          changedInfo:
            - 新增最小线程数抽取为可配置参数，支持运行时动态调整线程池大小，有效控制活跃连接数，避免因瞬时流量激增导致系统负载飙升

  - name: v2.0.11
    date: 2026-03-26
    changedInfo:
      New Features:
        - type: LLM 与搜索能力
          changedInfo:
            - 新增 MiniMax 作为 LLM Provider，遵循与 Qwen、DeepSeek 相同的接入模式，通过 OpenAI 兼容 API 对接。
            - 新增 Tavily 作为可插拔的互联网搜索后端。通过配置即可启用 Tavily API 进行实时网络搜索，为记忆系统提供外部知识补充能力。
        - type: 部署与运维 
          changedInfo:
            - 新增 health check API 端点，用于服务状态监控。支持容器编排（如 Kubernetes liveness/readiness probe）和负载均衡器的健康探测。
            - 新增生产级 Dockerfile（多阶段构建）和 Kubernetes Helm Chart，包含 MemOS API 服务、Neo4j 图数据库、Qdrant 向量数据库的编排配置，以及 Ingress 和示例 values 文件，支持一键部署到 K8s 集群。
        - type: 接口能力扩展
          changedInfo:
            - 此前 delete_memory 接口仅支持按 memory_id 删除。本次更新扩展了删除过滤条件，支持通过 user_id 和 conversation_id 批量删除记忆，并在 API 层增加了过滤参数校验，同时为 PostgreSQL 后端实现了 delete_node_by_params 方法。
      Bug Fixes:
        - type: MCP 与消息处理
          changedInfo:
            - 修复 MCP add_memory 工具消息格式问题；
            - 修复 get_further_suggestion 无法处理 string 类型输入参数的问题。
        - type: 记忆与反馈
          changedInfo:
            - 修复用户对记忆执行 feedback 操作后，相关记忆节点被错误归档（archived），导致后续检索时无法命中的问题；
        - type: Neo4j 
          changedInfo:
            - 修复 Neo4j 检索后过滤逻辑的问题；
            - 修复 Neo4j 嵌套 metadata 写入问题。

  - name: v2.0.10
    date: 2026-03-19
    changedInfo:
      Improvements:
        - type: PolarDB底层数据库
          changedInfo:
            - polardb优化升级，针对查询带有多种过滤条件的执行路径进行优化，通过使用新增内核能力改善cpu和内存使用率情况，使得查询能够数倍加速，缓解系统压力。
        - type: 记忆版本服务优化
          changedInfo:
            - 记忆版本插件化。
            - NLI模型添加高可用。
            - memreader处记忆版本增加路由，若无相关记忆召回/召回内容经nli模型全判断为无关，则走旧prompt和模型，否则才走记忆版本插件(qwen-flash)。
        - type: 服务优化
          changedInfo:
            - 调度任务优化改进，改善内存使用率情况。

  - name: v2.0.9
    date: 2026-03-16
    changedInfo:
      Improvements:
        - type: 记忆版本兼容 feedback
          changedInfo:
            - Feedback对节点更新时，走记忆版本逻辑，会更新到原节点，并把旧内容推到 history 字段中。
        - type: 记忆版本优化
          changedInfo:
            - 记忆版本在冲突消解/重复合并的过程中，全面优化了“恢复过去版本当中的独立事实”这条链路，当前能够更稳定、准确地恢复出独立事实，保留记忆信息完整，并减少由于模型回答不稳定而造成的记忆错乱。
      Bug Fixes:
        - type: 记忆版本参数等 bug 修复
          changedInfo:
            - 记忆版本参数校验、更新后 key 为空、update时间错误的几个 bug 修复。
        - type: feedback 问题修复
          changedInfo:
            - Feedback过程中sources为空的问题修复.
  - name: v2.0.8
    date: 2026-03-05
    changedInfo:
      New Features:
        - type: 新功能
          changedInfo:
            - 添加记忆时，会自动对冲突/重复记忆进行检测、合并和归档，保留最新记忆内容，并将旧记忆内容放在历史字段中；
      Improvements:
        - type: 偏好记忆迁移到图数据库
          changedInfo:
            - 偏好记忆迁移到图数据库，和其他记忆类型统一；
        - type: 记忆版本优化
          changedInfo:
            - 记忆版本功能完全迁移到异步执行，不影响async_mode=true时的addMessage接口时延；
        - type: 数据库优化
          changedInfo:
            - 采用信号量实现精细化的并发限流，结合故障连接自动剔除与线程生命周期管理，提升系统在高并发下的稳定性。
            - 优化日志级别与内容，保留关键执行轨迹，降低日志写入对数据库性能的影响。
            - 通过触发式预热，将热数据加载至缓存，避免冷启动带来的高延迟。
      Bug Fixes:
        - type: 记忆快添加的bug
          changedInfo:
            - 记忆添加时，如果选用了MultiModalStruct，在fast模式下部分情况没有进行embedding操作，导致快速模式记忆无法被搜索到；
        - type: 多模态记忆bug
          changedInfo:
            - 对于图片类记忆，修复没有单独解读图片内容的bug。
        - type: 记忆检索
          changedInfo:
            - 记忆检索减少重复调用get_by_metadata，降低了记忆检索耗时
        - type: 记忆版本并发问题修复
          changedInfo:
            - 记忆版本功能现在在并发add（小于add接口时延的短时间内收到多个add请求，并且add的是相关的记忆）情况下，也会按照时间顺序依次合并处理，而不是fallback到不处理
  - name: v2.0.7
    date: 2026-02-27
    changedInfo:
      Improvements:
        - type: 参数优化
          changedInfo:
            - search接口和chat接口的参数relativity，用于通过相关性分数来筛选召回的记忆，本次优化将相关性阈值默认值都设置为 0.45
        - type: 日志优化
          changedInfo:
            - 拦截部分日志报错，对部分日志级别进行调整
  - name: v2.0.6
    date: 2026-02-12
    changedInfo:
      New Features:
        - type: 检索优化
          changedInfo:
            - search 阶段新增关键词检索，并且 relativity 仍使用 embedding 的余弦相似度
            - Chat 接口加入 relativity 输出字段，用户可以使用 relativity 来控制聊天中的检索阈值
      Bug Fixes:
        - type: 问题修复
          changedInfo:
            - 修复偏好记忆阈值筛选使用字段错误的问题
            - 修复了一个导致调用 get_memory 接口时 filter 参数同时传入 field condition 和 AND/OR/NOT 等逻辑操作符时会发生调用失败或卡顿的问题
            - 修复一些 LLM extra body 传入问题，兼容 LLM 的 enable thinking 参数输入
  - name: v2.0.5
    date: 2026-02-10
    changedInfo:
      New Features:
        - type: 知识库检索优化
          changedInfo:
            - 双轨检索：支持“原文+记忆”协同存储与检索，可自定义召回模式。
            - 上下文唤醒：支持召回分片前后的上下文，增强长文本语义连贯性。
            - 相关性精筛：search 接口新增 relativity 字段（0~1），支持按阈值过滤低质召回。
        - type: MindDock
          changedInfo:
            - 云服务 Skill：新增云服务技能支持及快捷入口。
            - Prompt 实时注入：聊天中动态注入 Skill 模块，实现多模型间技能互通。
        - type: MCP 记忆删除
          changedInfo:
            - 当识别删除意图时，同步触发 deleteMemory 与 addFeedback。
      Improvements:
        - type: 调度与检索 pipeline 重构
          changedInfo:
            - Pipeline 重构：检索链路重构为 Search -> Enhance -> Rerank -> Filter 四阶段，由统一 API 调度。
            - 调度优化：任务处理器模块化，修复 Redis Streams 序列化及 user_context 传递问题。
        - type: Skills 优化
          changedInfo:
            - Skills 文档本地化：支持技能文档本地存储并生成专属 URL，可通过接口直接下载。
            - Skills 生成优化：目前能够从用户添加的历史信息中生成更丰富完整的 skills。
      Bug Fixes:
        - type: Playground 优化
          changedInfo:
            - 修复已知体验问题，提升环境稳定性。
  - name: v2.0.4
    date: 2026-01-30
    changedInfo:
      New Features:
        - type: 核心能力
          changedInfo:
            - 新增 Skill Memory。
            - 新增对记忆版本功能做支持的相关模块。
            - 新增 chat/completions 接口，兼容 OAI 协议。
      Improvements:
        - type: 检索优化
          changedInfo:
            - 减少了检索阶段事实记忆与偏好记忆的重复。
      Bug Fixes:
        - type: 问题修复
          changedInfo:
            - 解决 Playground 新用户 bug。
            - 修复云服务添加记忆时偶发的卡顿问题。
            - 解决图数据库效率问题。
  - name: v2.0.3
    date: 2026-01-22
    changedInfo:
      New Features:
        - type: 文档
          changedInfo:
            - 开源项目文档，修复格式、示例描述、中英文不匹配问题，新增使用小 tips。
        - type: Dashboard
          changedInfo:
            - 知识库新增支持文件类型, 支持 json、md、xml。
        - type: GitHub 示例仓库
          changedInfo:
            - 调整启动方式（新建类server router），移除 src/memos/product_api.py 引用。
      Improvements:
        - type: 开源项目
          changedInfo:
            - 优化文字与图片记忆添加，将两类信息作为单条消息协同处理。
            - 知识库检索支持 all 字段。
      Bug Fixes:
        - type: 开源项目
          changedInfo:
            - 修复当检索输入文本过长时的调用异常。

  - name: v2.0.2
    date: 2026-01-15
    changedInfo:
      New Features:
        - type: 发布「知识库问答助手」搭建教程
          changedInfo:
            - '公式ドキュメント更新「『ベース及びナレッジベースによる質問応答アシスタントの開発』のベストプラクティス」、手取り足取り“MemOS ナレッジベースアシスタント”の構築を教えます。'
      Improvements:
        - type: 'ナレッジベース文書リコール'
          changedInfo:
            - 'ナレッジベース文書内容の詳細に対する検索記憶インターフェースのリコール能力をさらに向上させ、文書内容に対する回答効果を最適化します。'
        - type: 'ツール記憶メカニズム'
          changedInfo:
            - '呼び出しトレースに対するプログラム的経験を追加し、ツール記憶の補助効果を向上させます；'
            - 'ツール schema 情報を圧縮し、ToolSchemaMemory の重複追加を回避します。'
        - type: '事実記憶のマージおよびアーカイブメカニズム'
          changedInfo:
            - '事実記憶の処理過程にマージおよびアーカイブメカニズムを追加し、記憶の重複書き込み・重複リコールの問題を最適化すると同時に、抽出の完全性に影響しないことを保証します。'
        - type: '記憶取得インターフェース'
          changedInfo:
            - 'ツール記憶の返却をサポート；'
            - '特定のフィルタ条件下の記憶の返却をサポートし、デバッグ、表示などのシナリオに使用します。'
      Bug Fixes:
        - type: '記憶取得インターフェース'
          changedInfo:
            - '記憶取得インターフェースで、入力引数が include_preference=False の場合の呼び出しエラーを修正しました。'

  - name: v2.0.1
    date: 2026-01-08
    changedInfo:
      New Features:
        - type: '記憶取得インターフェース公開'
          changedInfo:
            - '記憶取得インターフェースを公開し、ユーザー記憶の全量取得をサポートします。'
        - type: '対話機能をクラウドサービスで公開'
          changedInfo:
            - '対話機能をクラウドサービスで公開し、ワンクリックで“記憶永続”の対話を開始します。'
        - type: 'Playground更新'
          changedInfo:
            - 'Playground の記憶管理ページで記憶削除をサポートし、ユーザーが不要になった期限切れ記憶を手動で管理・削除できるようにします。'
      Improvements:
        - type: '記憶削除インターフェース'
          changedInfo:
            - '記憶削除インターフェースを最適化し、ユーザー記憶、ナレッジベース記憶などを含むすべての種類の記憶の削除をサポートします。'
        - type: '選好記憶'
          changedInfo:
            - 'feedbackインターフェースに選好記憶に対するフィードバック処理操作を追加'
        - type: '記憶検索最適化'
          changedInfo:
            - 'searchインターフェースで任意の重複排除パラメータをサポートし、意味類似の重複排除をサポートして検索結果の多様性を向上させます。'
      Bug Fixes:
        - type: 'KV Cache問題修復'
          changedInfo:
            - '新版 MemOS における互換性問題により kv cache コードでエラーが報告される問題を解決しました'
        - type: 'スケジューリングモジュール問題修復'
          changedInfo:
            - 'スケジューリングで local モードを有効化した際、redis 設定不足によりエラーが報告される問題を修正しました'

  - name: v2.0.0
    date: 2025-12-24
    changedInfo:
      New Features:
        - type: 'ナレッジベースと記憶能力'
          changedInfo:
            - 'ナレッジベース機能を追加し、文書と URL に基づく自己進化可能な長期記憶体系の構築をサポートします'
        - type: 'フィードバックと記憶管理'
          changedInfo:
            - '記憶フィードバックと修正能力を追加し、自然言語による既存記憶の調整をサポートします'
            - '記憶削除インターフェースを追加し、memory id による指定ユーザー記憶の削除をサポートします'
            - 'MCP に記憶削除とフィードバック能力を新規追加'
        - type: '対話と検索'
          changedInfo:
            - 'チャットインターフェースを追加し、履歴記憶に基づく検索式応答をサポートします'
            - '記憶フィルタリングとカスタム tag / info 検索をサポートします（クラウドサービス & オープンソースプロジェクト）'
        - type: 'マルチモーダルとツール記憶'
          changedInfo:
            - 'ツール記憶サポートを追加し、ツール呼び出し履歴の経験抽出と検索をサポートします'
            - '画像メッセージ記憶サポートを追加し、対話と文書画像理解をサポートします'
      Improvements:
        - type: 'データとインフラストラクチャ'
          changedInfo:
            - '基盤 DB をアップグレードし、安定性、接続管理およびデータ操作性能を向上させます'
        - type: 'スケジューリングモジュール'
          changedInfo:
            - 'スケジューリングシステムを再構築し、Redis Streams と多段キュー分離メカニズムを導入します'
            - 'タスク優先度、自動復旧およびクォータスケジューリング能力を追加します'
        - type: 'デプロイとエンジニアリング'
          changedInfo:
            - '軽量デプロイモードを追加し、高速と完全の2種類のデプロイ方案をサポートします'
      Bug Fixes:
        - type: '記憶スケジューリングと更新タスク'
          changedInfo:
            - '旧版記憶スケジューリングインターフェースの互換性問題を修正し、ユーザー記憶分離の正確性を確保します'
            - '記憶更新タスクログの異常を修正し、新規記憶が正常に表示されることを確保します'

  - name: v1.1.3
    date: 2025-11-05
    changedInfo:
      New Features:
        - type: '記憶の追加と検索'
          changedInfo:
            - '非同期追加モードを追加（平文と選好をサポート）'
            - '選好記憶の全リンクをサポート'
            - 'Reranker 戦略セットを導入'
            - 'TreeTextMemory は BM25 検索アルゴリズムをサポート'
        - type: 'スケジューリングモジュール'
          changedInfo:
            - 'API スケジューリングモジュールのモジュール化リファクタリング'
            - 'Redis ORM を最適化し、履歴同期とハイブリッド検索に使用'
        - type: 'データとインフラストラクチャ'
          changedInfo:
            - 'PolarDB グラフバックエンドにコネクションプールとタイムアウト制御を追加し、関連問題を修正'
            - 'グラフファクトリを統一（Neo4j / PolarDB / Nebula をサポート）'
            - 'Milvus インターフェースとデータ項目構造を最適化'
            - 'ログチェーンと監視情報を強化'
            - 'Nacos ベースの動的設定管理'
        - type: '評価体系'
          changedInfo:
            - 'PrefEval フィールドの標準化'
            - 'LoCoMo / LongMemEval / PrefEval / PersonaMem 評価プロセスをアップグレード'
      Improvements:
        - type: '平文記憶'
          changedInfo:
            - '選好フィールドの標準化'
        - type: 'プロジェクトフレームワーク'
          changedInfo:
            - 'API ルーティングモジュールを更新'
            - 'エラーハンドリングとコンテキスト追跡の安定性を強化'
      Bug Fixes:
        - type: 'スケジューリングモジュール'
          changedInfo:
            - 'クエリスケジューリングの境界条件問題を修正'
            - 'メッセージキュー schema 問題を修正'
        - type: '平文記憶'
          changedInfo:
            - 'PolarDB グラフデータベース関連エラーを修正'
        - type: 'プロジェクトフレームワーク'
          changedInfo:
            - 'SQLite ユーザーリスト異常を修正'
  - name: v1.1.1
    date: 2025-09-25
    changedInfo:
      New Features:
        - type: 'クラウドサービス 1.0 内部テスト版をリリース'
          changedInfo:
            - '🛠️ すぐに使える：複雑なデプロイ不要で、直接クラウド API 経由で接続'
            - '🔄 クロスセッション記憶：ユーザープロファイル、選好、行動を自動リコールし、継続的なパーソナライズを実現'
            - '📖 Developer-Friendly：ドキュメント、サンプルコードを全面サポート'
            - '🎁 Free Quota：すべての開発者が基本枠を受け取れ、探索に便利'
        - type: '企業グループチャット Q&A ボット'
          changedInfo:
            - 'クラウドサービス知識ベース Q&A をサポート'
  - name: v1.0.1
    date: 2025-09-10
